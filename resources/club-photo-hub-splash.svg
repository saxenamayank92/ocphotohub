<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Club PhotoHub</title>
  <desc id="desc">Club PhotoHub camera mark and wordmark on the branded navy dotted background.</desc>
  <defs>
    <radialGradient id="glow" cx="82%" cy="12%" r="70%">
      <stop offset="0" stop-color="#397874" stop-opacity="0.42" />
      <stop offset="0.48" stop-color="#263a5c" stop-opacity="0.98" />
      <stop offset="1" stop-color="#0d1728" />
    </radialGradient>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#c5a059" fill-opacity="0.18" />
