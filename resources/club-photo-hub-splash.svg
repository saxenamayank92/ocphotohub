    <circle cx="239" cy="239" r="12" fill="#F7F5F0" opacity=".9" />
    <path d="M366 185h44a18 18 0 0 1 18 18v106a18 18 0 0 1-18 18h-44" fill="none" stroke="#F7F5F0" stroke-width="24" stroke-linecap="round" />
  </g>

  <text x="600" y="885" text-anchor="middle" fill="#F7F5F0" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-1">Club PhotoHub</text>
  <text x="600" y="945" text-anchor="middle" fill="#C8A76B" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="7">PRIVATE CLUB PHOTO SHARING</text>
