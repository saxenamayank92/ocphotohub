LEGACY_PHOTO_HOSTS = "images.unsplash.com"
STRIPE_MONTHLY_LINK = "https://buy.stripe.com/5kQ4gz3FFbTH76IgC15Vu08"
STRIPE_ANNUAL_LINK = "https://buy.stripe.com/bJe00j7VV6zn8aMgC15Vu09"
