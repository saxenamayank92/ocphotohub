[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 12
  period = 60

[[ratelimits]]
name = "RESET_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 4
  period = 60

[[ratelimits]]
name = "SEARCH_RATE_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 30
  period = 60
